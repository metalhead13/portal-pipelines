services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pipeline_portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - portal_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d pipeline_portal"]
      interval: 5s
      retries: 10
volumes:
  portal_db:
